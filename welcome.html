<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InteractiveFics</title>
  <link rel="stylesheet" href="welcome.css">
</head>
<body>
  <main class="welcome-card">
    <img src="icon-128.png" alt="InteractiveFics" class="logo">
    <h1 id="title">Bem-vindo ao InteractiveFics<br><span>Welcome to InteractiveFics</span></h1>
    <p id="description">Escolha o idioma da extensão.<br><span>Choose the extension language.</span><br><br>Depois, você pode trocar clicando na bandeira no topo do popup.<br><span>You can change it later by clicking the flag at the top of the popup.</span></p>
    <div class="language-options">
      <button data-lang="pt"><img src="flag-br.svg" alt="Brasil"><span>Português</span></button>
      <button data-lang="en"><img src="flag-us.svg" alt="United States"><span>English</span></button>
    </div>
  </main>
  <script src="welcome.js"></script>
</body>
</html>
